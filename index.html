<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NeuroVision</title>
</head>
<body>

<h1>NeuroVision 🧠</h1>

<!-- FORMULAIRE -->
<label>Nom:</label>
<input type="text" id="name"><br><br>

<label>Prénom:</label>
<input type="text" id="surname"><br><br>

<label>Âge:</label>
<input type="number" id="age" min="1" max="100"><br><br>

<!-- SEXE -->
<label>Sexe:</label><br>
<input type="radio" name="sex" id="male"> Homme<br>
<input type="radio" name="sex" id="female"> Femme<br><br>

<!-- MALADIES -->
<h3>Maladies graves</h3>
<input type="checkbox" id="diabete"> Diabète<br>
<input type="checkbox" id="hypertension"> Hypertension<br>
<input type="checkbox" id="cancer"> Cancer<br><br>

<!-- MODES -->
<h3>Mode</h3>
<button onclick="setMode('patient')">Patient</button>
<button onclick="setMode('student')">Student</button>
<button onclick="setMode('doctor')">Doctor</button>

<br><br>

<!-- ANALYSE -->
<select onchange="setMode(this.value)">
    <option value="patient">Patient</option>
    <option value="student">Student</option>
    <option value="doctor">Doctor</option>
    </select>
<button onclick="analyze()">Analyser</button>
<button onclick="loadEEGData()">Load EEG Data</button>
<button onclick="drawChart()">Show EEG Chart</button>

<h2>Résultat :</h2>
<p id="result"></p>
<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload EEG</button>
<canvas id="eegChart" width="600" height="300"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
